<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Assistant – Open in your instance</title>
  <meta name="description" content="Open this shared track, artist or playlist in your own Music Assistant instance." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1.5rem;
      font-size: .85rem;
      color: #888;
    }
    .logo svg { width: 24px; height: 24px; }

    .preview {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .art {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    .art-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .meta h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: .25rem; }
    .meta p  { font-size: .9rem; color: #aaa; }

    .url-row {
      display: flex;
      gap: .5rem;
      margin-bottom: 1rem;
    }
    .url-row input {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: .9rem;
      padding: .6rem .75rem;
      outline: none;
    }
    .url-row input:focus { border-color: #03a9f4; }

    button {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 600;
      padding: .75rem 1.25rem;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }

    #btn-open {
      width: 100%;
      background: #03a9f4;
      color: #000;
      margin-bottom: .75rem;
    }
    #btn-save {
      background: #333;
      color: #e0e0e0;
      padding: .6rem .9rem;
      font-size: .85rem;
    }

    .error {
      background: rgba(207, 102, 121, 0.12);
      border: 1px solid rgba(207, 102, 121, 0.4);
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .85rem;
      color: #cf6679;
      margin-top: 1rem;
      display: none;
    }

    .hint { font-size: .78rem; color: #666; margin-top: .5rem; }

    .provider-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: .75rem;
    }
    .provider-btn {
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: .8rem;
      font-weight: 500;
      padding: .5rem .9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      transition: background .15s, border-color .15s;
    }
    .provider-btn:hover { opacity: .85; }
    .provider-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .tracklist {
      margin-bottom: 1rem;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 8px;
    }
    .tracklist-item {
      padding: .45rem .75rem;
      font-size: .82rem;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      gap: .5rem;
    }
    .tracklist-item:last-child { border-bottom: none; }
    .tracklist-item .t-num { color: #555; min-width: 1.5rem; text-align: right; }
    .tracklist-item .t-title { flex: 1; }
    .tracklist-item .t-artist { color: #888; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
      <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="m 109.394,4.3814 c 5.848,-5.84187 15.394,-5.84187 21.212,0 l 98.788,98.8876 c 5.848,5.842 10.606,17.374 10.606,25.638 v 90.11 l -0.005,0.356 c -0.206,8.086 -6.881,14.628 -14.995,14.628 H 15 C 6.75759,234.001 2.40473e-5,227.22 0,218.987 v -90.11 c 1.20331e-4,-8.264 4.78834,-19.796 10.6064,-25.638 z" fill="#f2f4f9"/>
        <path d="m 109.394,4.3814 c 5.848,-5.84187 15.394,-5.84187 21.212,0 l 98.788,98.8876 c 5.848,5.842 10.606,17.374 10.606,25.638 v 90.11 l -0.005,0.356 c -0.206,8.086 -6.881,14.628 -14.995,14.628 H 15 C 6.75759,234.001 2.40473e-5,227.22 0,218.987 v -90.11 c 1.20331e-4,-8.264 4.78834,-19.796 10.6064,-25.638 z M 36,120.001 c -4.4183,0 -8,3.581 -8,8 v 78 h 16 v -78 c 0,-4.419 -3.5817,-8 -8,-8 z m 32,0 c -4.4183,0 -8,3.581 -8,8 v 78 h 16 v -78 c 0,-4.419 -3.5817,-8 -8,-8 z m 32,0 c -4.4183,0 -8,3.581 -8,8 v 78 h 16 v -78 c 0,-4.419 -3.582,-8 -8,-8 z m 58.393,0.426 c -4.193,-1.395 -8.722,0.873 -10.118,5.065 l -26.796,80.509 h 16.863 l 25.114,-75.457 c 1.395,-4.192 -0.872,-8.721 -5.063,-10.117 z m 30.315,5.065 c -1.395,-4.192 -5.925,-6.46 -10.117,-5.065 -4.192,1.396 -6.46,5.925 -5.065,10.117 l 25.116,75.457 h 16.862 z" fill="#18bcf2"/>
      </svg>
      <a href="https://music-assistant.io" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">Music Assistant</a>
  </div>

  <div class="preview" id="preview">
    <div class="art-placeholder" id="art-placeholder">🎵</div>
    <div class="meta">
      <h1 id="title">Loading…</h1>
      <p id="subtitle"></p>
    </div>
  </div>

  <div class="url-row">
    <input type="url" id="ma-url" placeholder="http://homeassistant.local:8095" />
    <button id="btn-save" title="Save MA URL">💾</button>
  </div>

  <div class="provider-buttons" id="provider-buttons" style="display:none"></div>

  <div class="tracklist" id="tracklist" style="display:none"></div>

  <button id="btn-open">Open in Music Assistant</button>

  <p class="hint">Enter the address of your Music Assistant instance above.<br>
  It is saved in your browser for next time.</p>

  <div class="error" id="error"></div>
</div>

<script>
  const STORAGE_KEY = "ma_instance_url";
  const COMMON_URLS = [
    "http://homeassistant.local:8095",
    "http://localhost:8095",
    "http://musicassistant.local:8095",
  ];

  const PROVIDER_LABELS = {
    spotify: "Spotify", tidal: "Tidal", qobuz: "Qobuz",
    ytmusic: "YouTube Music", deezer: "Deezer", apple_music: "Apple Music",
  };
  const PROVIDER_COLORS = {
    spotify: "#1DB954", tidal: "#00FFFF", qobuz: "#00B4B4",
    ytmusic: "#FF0000", deezer: "#A238FF", apple_music: "#FA2D48",
  };
  // Minimal inline SVG icons per provider
  const PROVIDER_ICONS = {
    spotify: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>`,
    tidal: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.012 3.992L8.008 7.996 4.004 3.992 0 7.996l4.004 4.004 4.004-4.004 4.004 4.004 4.004-4.004zM8.008 16.004l4.004-4.004 4.004 4.004L20.02 12l-4.004-4.004-4.004 4.004-4.004-4.004L4.004 12z"/></svg>`,
    ytmusic: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/></svg>`,
    deezer: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.81 11.32h3.381v1.504H18.81zm0 2.604h3.381v1.505H18.81zm0-5.206h3.381v1.505H18.81zM0 16.43h3.381v1.505H0zm4.702 0h3.382v1.505H4.702zm4.703 0h3.382v1.505H9.405zm4.702 0h3.382v1.505h-3.382zm4.703 0h3.381v1.505H18.81zM0 13.924h3.381v1.505H0zm4.702 0h3.382v1.505H4.702zm4.703 0h3.382v1.505H9.405zm4.702 0h3.382v1.505h-3.382zm-9.405-2.604h3.382v1.504H4.702zm4.703 0h3.382v1.504H9.405zm4.702 0h3.382v1.504h-3.382zM9.405 8.718h3.382v1.504H9.405zm4.702 0h3.382v1.504h-3.382zM14.107 6.114h3.382v1.504h-3.382z"/></svg>`,
    apple_music: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.994 6.124a9.23 9.23 0 00-.24-2.19c-.317-1.31-1.062-2.31-2.18-3.043a5.022 5.022 0 00-1.877-.726 10.496 10.496 0 00-1.split-.204c-.667-.073-5.456-.104-5.456-.104S7.044 0 6.26.017C5.77.026 5.29.05 4.81.09c-.37.03-.738.065-1.098.152a5.01 5.01 0 00-1.878.72C.72 1.629-.027 2.632-.001 3.944c.01.585.04 1.172.08 1.756.062.93.196 1.85.417 2.754.252 1.02.693 1.963 1.394 2.748.62.696 1.39 1.204 2.262 1.536.625.236 1.277.37 1.935.45.406.05.813.073 1.22.098l5.397.085 5.387-.089c.409-.03.816-.054 1.222-.106.663-.083 1.317-.222 1.942-.46.875-.334 1.644-.843 2.264-1.543.697-.783 1.134-1.726 1.385-2.745.22-.9.35-1.82.41-2.747.044-.591.074-1.183.083-1.773C24 6.437 24 6.124 23.994 6.124zm-8.01 8.367v-5.25l-4.5 5.25V9.373h1.498v5.24l4.5-5.24v5.118H15.984z"/></svg>`,
    qobuz: `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><text x="12" y="16" text-anchor="middle" fill="#0f0f0f" font-size="10" font-weight="bold">Q</text></svg>`,
  };

  // --- decode payload from URL fragment ---
  let payload = null;
  try {
    const raw = location.hash.slice(1);
    if (raw) {
      // URL-safe base64 → standard base64 → JSON
      const b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
      payload = JSON.parse(atob(b64));
    }
  } catch (e) {
    showError("Could not decode share link. It may be corrupted.");
  }

  // --- populate preview card ---
  if (payload) {
    document.title = payload.title
      ? `${payload.title} – Music Assistant`
      : "Music Assistant – Open in your instance";

    document.getElementById("title").textContent = payload.title || "Unknown";

    const parts = [];
    if (payload.artist) parts.push(payload.artist);
    if (payload.album)  parts.push(payload.album);
    document.getElementById("subtitle").textContent = parts.join(" · ");

    if (payload.art) {
      const img = document.createElement("img");
      img.className = "art";
      img.src = payload.art;
      img.alt = payload.title || "";
      img.onerror = () => img.replaceWith(document.getElementById("art-placeholder"));
      document.getElementById("art-placeholder").replaceWith(img);
    } else {
      // pick emoji by type
      const emojis = { track: "🎵", artist: "🎤", album: "💿", playlist: "📋" };
      document.getElementById("art-placeholder").textContent =
        emojis[payload.type] || "🎵";
    }
    // provider links from payload
    if (payload.links && Object.keys(payload.links).length) {
      const container = document.getElementById("provider-buttons");
      container.style.display = "flex";
      for (const [domain, url] of Object.entries(payload.links)) {
        addProviderButton(container, domain, url);
      }
    }

    // playlist track list
    if (payload.type === "playlist" && payload.tracks?.length) {
      const tl = document.getElementById("tracklist");
      tl.style.display = "block";
      payload.tracks.forEach((t, i) => {
        const row = document.createElement("div");
        row.className = "tracklist-item";
        row.innerHTML = `<span class="t-num">${i + 1}.</span><span class="t-title">${t.title || "?"}</span><span class="t-artist">${t.artist || ""}</span>`;
        tl.appendChild(row);
      });
    }
  }

  function addProviderButton(container, domain, url) {
    const label = PROVIDER_LABELS[domain] || domain;
    const color = PROVIDER_COLORS[domain] || "#888";
    const icon = PROVIDER_ICONS[domain] || "";
    const a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.className = "provider-btn";
    a.style.borderColor = color + "66";
    a.style.color = color;
    a.innerHTML = icon + label;
    container.appendChild(a);
    container.style.display = "flex";
  }

  // --- restore saved MA URL ---
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) document.getElementById("ma-url").value = saved;

  // --- save button ---
  document.getElementById("btn-save").addEventListener("click", () => {
    const url = (document.getElementById("ma-url").value || "").trim().replace(/\/$/, "");
    if (url) {
      localStorage.setItem(STORAGE_KEY, url);
      document.getElementById("btn-save").textContent = "✓";
      setTimeout(() => (document.getElementById("btn-save").textContent = "💾"), 1500);
    }
  });

  const HTTP_PATH = "/api/share/resolve";

  // --- open button ---
  document.getElementById("btn-open").addEventListener("click", async () => {
    const encoded = location.hash.slice(1);
    if (!encoded) { showError("No share payload found in URL."); return; }

    const customUrl = (document.getElementById("ma-url").value || "").trim().replace(/\/$/, "");
    const candidates = customUrl
      ? [customUrl, ...COMMON_URLS.filter(u => u !== customUrl)]
      : COMMON_URLS;

    hideError();
    document.getElementById("btn-open").textContent = "Connecting…";

    for (const base of candidates) {
      try {
        const resp = await fetch(`${base}${HTTP_PATH}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ encoded }),
          signal: AbortSignal.timeout(5000),
        });
        if (resp.ok) {
          const item = await resp.json();
          if (customUrl) localStorage.setItem(STORAGE_KEY, base);
          // Build the MA frontend route from the item URI
          // URI format: <provider>://<media_type>/<item_id>
          // Route format: /#/<media_type>s/<provider>/<item_id>
          const uri = item?.uri;
          let target = `${base}/`;
          if (uri) {
            const m = uri.match(/^([^:]+):\/\/([^/]+)\/(.+)$/);
            if (m) {
              const [, provider, mediaType, itemId] = m;
              target = `${base}/#/${mediaType}s/${provider}/${itemId}`;
            }
          }
          window.location.href = target;
          return;
        }
      } catch (_) {
        // try next candidate
      }
    }

    document.getElementById("btn-open").textContent = "Open in Music Assistant";
    showError(
      "Could not reach a Music Assistant instance. " +
      "Please enter your MA URL above and try again."
    );
  });

  function showError(msg) {
    const el = document.getElementById("error");
    el.textContent = msg;
    el.style.display = "block";
  }
  function hideError() {
    document.getElementById("error").style.display = "none";
  }
</script>
</body>
</html>
